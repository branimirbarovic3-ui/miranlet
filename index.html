<!DOCTYPE html>
<html lang="hr" class="scroll-smooth bg-background text-primary">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo-ml.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Primary -->
    <title>Miran Let | Putuj slobodno i zaboravi na strah od letenja</title>
    <meta name="description" content="Savladaj strah od letenja uz Miran Let digitalni protokol. Klinički provjerene tehnike avijacijske psihologije, audio vježbe i vodič za mirno putovanje zrakoplovom." />
    <meta name="keywords" content="strah od letenja, miran let, strah od aviona, anksioznost let, turbulencija, psihologija letenja, hrvatska, regija" />
    <link rel="canonical" href="https://www.miranlet.com" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.miranlet.com" />
    <meta property="og:title" content="Miran Let | Putuj slobodno i zaboravi na strah od letenja" />
    <meta property="og:description" content="Vrati kontrolu u svoje ruke. Kompletan audio i PDF vodič za putnike koji žele mir na 10.000 metara." />
    <meta property="og:image" content="/logo-ml.jpg" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org/",
      "@type": "Product",
      "name": "Miran Let Digitalni Protokol",
      "image": "https://www.miranlet.com/bundle.png",
      "description": "Metodologija za nadvladavanje straha od letenja utemeljena na avijacijskoj psihologiji.",
      "brand": {
        "@type": "Brand",
        "name": "Miran Let"
      },
      "offers": {
        "@type": "Offer",
        "url": "https://www.miranlet.com",
        "priceCurrency": "EUR",
        "price": "27",
        "availability": "https://schema.org/InStock"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "reviewCount": "124"
      }
    }
    </script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
